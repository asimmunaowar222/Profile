<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asim Munaowar</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { background: #ffffff; }

    body {
      font-family: Georgia, "Times New Roman", serif;
      color: #000000;
      background: #ffffff;
      overflow-x: hidden;
    }

    /* উপরের কালো অংশ */
    .top {
      position: relative;
      z-index: 1;
      height: 50vh;
      min-height: 220px;
      background: #000000;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    /* উপরে উঠলে ফাঁকা জায়গা যাতে না দেখা যায় */
    .top::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: -30px;
      height: 30px;
      background: #000000;
    }

    .top:hover {
      transform: translateY(-8px);
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.45);
    }

    /* টার্মিনাল রেইন ক্যানভাস */
    #rain {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* নিচের সাদা অংশ */
    .bottom {
      position: relative;
      z-index: 0;
      background: #ffffff;
      padding: 150px 24px 56px;
      display: flex;
      justify-content: center;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .bottom:hover {
      z-index: 2;
      transform: translateY(-8px);
      box-shadow: 0 -10px 28px rgba(0, 0, 0, 0.35);
    }

    /* কালো-সাদা রেখার ঠিক মাঝখানে গোল ছবি */
    .photo {
      position: absolute;
      z-index: 5;
      left: 50%;
      top: max(50vh, 220px);
      width: 220px;
      height: 220px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      object-fit: cover;
      border: 8px solid #ffffff;
      box-shadow: 0 0 0 3px #000000;
      background: #dddddd;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .photo:hover {
      transform: translate(-50%, calc(-50% - 12px));
      box-shadow: 0 0 0 3px #000000, 0 18px 30px rgba(0, 0, 0, 0.5);
    }

    /* label : value আকারে সাজানো তথ্য */
    .info {
      display: flex;
      flex-direction: column;
      gap: 16px;
      font-size: 1.15rem;
      line-height: 1.4;
      max-width: 100%;
    }

    /* প্রতিটা লাইন বাটনের মতো */
    .row {
      display: grid;
      grid-template-columns: 11em auto 1fr;
      column-gap: 12px;
      align-items: baseline;
      padding: 12px 18px;
      border: 2px solid #000000;
      background: #ffffff;
      color: #000000;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease,
                  background 0.2s ease, color 0.2s ease;
    }

    .row:hover,
    .row:focus-visible {
      transform: translateY(-5px);
      box-shadow: 0 8px 0 #000000;
      background: #000000;
      color: #ffffff;
      outline: none;
    }

    .row:active {
      transform: translateY(-1px);
      box-shadow: 0 2px 0 #000000;
    }

    .row .label { font-weight: 700; }
    .row .value { word-break: break-all; }

    @media (max-width: 600px) {
      .info { font-size: 1rem; }
      .row {
        grid-template-columns: 1fr;
        row-gap: 2px;
      }
      .row .colon { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="top">
    <canvas id="rain" aria-hidden="true"></canvas>
  </div>

  <img class="photo" src="me.png" alt="Photo of Asim Munaowar">

  <main class="bottom">
    <div class="info">
      <div class="row" tabindex="0">
        <span class="label">Name</span>
        <span class="colon">:</span>
        <span class="value">Asim Munaowar</span>
      </div>

      <a class="row" href="mailto:asimmunaowar123@gmail.com">
        <span class="label">Student Email</span>
        <span class="colon">:</span>
        <span class="value">asimmunaowar123@gmail.com</span>
      </a>

      <a class="row" href="mailto:asimmunaowar222@gmail.com">
        <span class="label">Professional Email</span>
        <span class="colon">:</span>
        <span class="value">asimmunaowar222@gmail.com</span>
      </a>
    </div>
  </main>

  <script>
    /* ===== টার্মিনাল রেইন সেটিং (এখানে বদলান) ===== */
    const CHARS = "01<>{}[]/\\|$#@%&*+=;:ABCDEF0123456789";  // যে অক্ষরগুলো ঝরবে
    const FONT_SIZE = 16;        // অক্ষরের সাইজ
    const SPEED = 45;            // ছোট সংখ্যা = দ্রুত (মিলিসেকেন্ড প্রতি ধাপে)
    const TEXT_COLOR = "#b5b5b5"; // ধূসর
    const HEAD_COLOR = "#ffffff"; // সবার আগের অক্ষর সাদা
    const FADE = 0.08;           // ছোট = লম্বা লেজ, বড় = ছোট লেজ
    /* ============================================= */

    const canvas = document.getElementById("rain");
    const ctx = canvas.getContext("2d");
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    let columns = 0;
    let drops = [];
    let width = 0;
    let height = 0;

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      width = canvas.clientWidth;
      height = canvas.clientHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, width, height);
      ctx.font = FONT_SIZE + "px monospace";
      columns = Math.ceil(width / FONT_SIZE);
      drops = Array.from({ length: columns }, () => Math.floor(Math.random() * -(height / FONT_SIZE)));
    }

    function step() {
      ctx.fillStyle = "rgba(0, 0, 0, " + FADE + ")";
      ctx.fillRect(0, 0, width, height);

      for (let i = 0; i < columns; i++) {
        const ch = CHARS[Math.floor(Math.random() * CHARS.length)];
        const x = i * FONT_SIZE;
        const y = drops[i] * FONT_SIZE;

        if (y > 0) {
          // আগের অক্ষরটা ধূসর করে দেওয়া
          ctx.fillStyle = TEXT_COLOR;
          ctx.fillText(ch, x, y - FONT_SIZE);
          // সবার আগেরটা সাদা
          ctx.fillStyle = HEAD_COLOR;
          ctx.fillText(ch, x, y);
        }

        if (y > height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }

    resize();
    window.addEventListener("resize", resize);

    if (reduceMotion) {
      // অ্যানিমেশন বন্ধ রাখলে কয়েক ধাপ এঁকে স্থির রাখা হবে
      for (let n = 0; n < 60; n++) step();
    } else {
      let last = 0;
      function loop(t) {
        if (t - last > SPEED) {
          step();
          last = t;
        }
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    }
  </script>
</body>
</html>
